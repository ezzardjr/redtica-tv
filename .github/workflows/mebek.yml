name: Compilar APK Mebek TV (prueba)

on:
  push:
    paths: ["mebek/**", ".github/workflows/mebek.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mebek
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p salida
          mv app/build/outputs/apk/release/app-release.apk salida/MebekTV-prueba.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MebekTV-prueba
          path: mebek/salida/*.apk
