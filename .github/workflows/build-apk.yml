name: Compilar APK RedTica TV

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleClienteDebug assemblePruebaDebug --no-daemon
          mv app/build/outputs/apk/cliente/debug/app-cliente-debug.apk RedTicaTV-cliente.apk
          mv app/build/outputs/apk/prueba/debug/app-prueba-debug.apk RedTicaTV-prueba.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RedTicaTV-apk
          path: |
            RedTicaTV-cliente.apk
            RedTicaTV-prueba.apk
